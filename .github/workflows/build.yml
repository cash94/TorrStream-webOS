# Сборка ipk для webOS (LG) по тегу v* (git tag v1.0.1 && git push origin v1.0.1).
#
# Версия пакета берётся из тега (tools/build.py --version), править руками не
# нужно. Собираются два приложения (tools/build.py):
#   com.torrstream.app     → TorrStream-webOS.ipk — обычное;
#   com.torrstream.app.ts  → TorrStream-webOS-TorrServer.ipk — со встроенным
#                            TorrServer (нужен root через Homebrew Channel).
# Постоянные имена — для ссылки releases/latest/download/<имя>.
# Запуск вручную (Actions → build → Run workflow) — только сборка, ipk в артефакте.
name: build

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: ipk (обычный и с TorrServer)
        run: |
          VER=""
          case "$GITHUB_REF" in refs/tags/v*) VER="--version ${GITHUB_REF_NAME#v}";; esac
          python3 tools/build.py $VER
          python3 tools/build.py --ts $VER
          ls -la dist

      - name: Релиз
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.ipk \
            --title "TorrStream для webOS ${GITHUB_REF_NAME#v}" \
            --notes "TorrStream-webOS.ipk — обычное приложение. TorrStream-webOS-TorrServer.ipk — отдельное приложение со встроенным TorrServer (скачивается официальная сборка; нужен Homebrew Channel с root). Установка: Developer Mode (ares-install) или Homebrew Channel."

      - name: Артефакт
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: TorrStream-webOS
          path: dist/*.ipk
          retention-days: 7
